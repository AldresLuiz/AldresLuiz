name: Update README with Repositories

on:
  schedule:
    # Executa todo dia às 02:00 (UTC) — ajuste o horário se quiser
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # Faz checkout do repositório
      - name: Checkout repo
        uses: actions/checkout@v4

      # Atualiza o README gerando a lista de repositórios automaticamente
      - name: Update GitHub Profile README
        uses: theboi/github-update-readme@v1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          header: "## 🚀 Meus Projetos"
          subhead: ""
          footer: "" 
          path: "README.md"
          repoCount: "100"
          reposPerRow: "3"
          imageSize: "100"
